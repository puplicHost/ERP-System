version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: erp-ai-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: erp-ai
    volumes:
      - mongodb_data:/data/db
    networks:
      - erp-network

volumes:
  mongodb_data:
    driver: local

networks:
  erp-network:
    driver: bridge
